<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LIF Board — Leadership in the Field</title>
<link rel="icon" href="logo-mark.png">
<meta name="theme-color" content="#1d1d1b">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --y:#ffc20e; --y2:#ffe07a; --y3:#fff6d6;
  --ink:#1d1d1b; --ink2:#3a3934; --mut:#6f6b60;
  --bg:#f3efe4; --card:#fff; --line:#e7dfc9; --line2:#d6ccb0;
  --ok:#15803d; --okbg:#dcfce7; --bad:#dc2626; --badbg:#fee2e2; --plan:#64748b; --planbg:#eef2f6;
  --red:#e11d2a;
  --r:.7rem; --shadow:0 .1rem .5rem rgba(40,30,0,.08);
}
*{box-sizing:border-box}
html{font-size:clamp(11px,.78vw,30px)}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* top bar */
.top{display:flex;align-items:center;gap:1rem;background:var(--ink);color:#fff;padding:.5rem 1rem;flex:none}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.brand img{height:2.4rem}
.brand b{font-size:1.45rem;letter-spacing:.04em;color:var(--y);white-space:nowrap}
.brand small{display:block;font-size:.8rem;color:#bdb8a8;letter-spacing:.02em;white-space:nowrap}
.tabs{display:flex;gap:.2rem;margin-left:.6rem;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:.5rem .6rem;border-radius:.5rem;font-size:.97rem;color:#e9e5d8;white-space:nowrap;font-weight:600}
.tabs button .n{display:inline-grid;place-items:center;width:1.5rem;height:1.5rem;border-radius:50%;background:#3b3a35;color:var(--y);font-size:.85rem;margin-right:.4rem}
.tabs button.on{background:var(--y);color:var(--ink)}
.tabs button.on .n{background:var(--ink)}
.tbtn{display:inline-flex;align-items:center;gap:.45rem;padding:.55rem .9rem;border-radius:.5rem;background:#34332e;color:#fff;font-weight:600;font-size:.98rem;white-space:nowrap}
.tbtn.on{background:var(--y);color:var(--ink)}
.tbtn svg{width:1.2rem;height:1.2rem}

/* sub bar */
.sub{display:flex;align-items:center;gap:.8rem;padding:.55rem 1rem;background:var(--y);flex:none;flex-wrap:wrap}
.datenav{display:flex;align-items:center;gap:.35rem}
.datenav button:not(.sbtn){width:2.8rem;height:2.6rem;border-radius:.5rem;background:rgba(0,0,0,.08);font-size:1.4rem;font-weight:700}
.datenav input{height:2.6rem;border:0;border-radius:.5rem;padding:0 .6rem;font-size:1.05rem;background:#fff}
.wk{font-weight:800;font-size:1.25rem}
.wk small{font-weight:600;font-size:.95rem;opacity:.75;margin-left:.5rem}
.sp{flex:1}
.sync{display:flex;align-items:center;gap:.45rem;font-size:.95rem;font-weight:600;background:rgba(255,255,255,.55);padding:.4rem .8rem;border-radius:2rem}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:#9ca3af}
.dot.ok{background:var(--ok)} .dot.busy{background:#f59e0b} .dot.bad{background:var(--bad)}
.sbtn{padding:.55rem .9rem;border-radius:.5rem;background:var(--ink);color:#fff;font-weight:700;font-size:.98rem}
.sbtn.light{background:rgba(255,255,255,.7);color:var(--ink)}

/* main */
main{flex:1;min-height:0;padding:.7rem;overflow:auto}
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;border:1px solid var(--line)}
.ph{display:flex;align-items:center;gap:.5rem;padding:.5rem .7rem;background:var(--y3);border-bottom:1px solid var(--line);flex:none}
.ph h3{margin:0;font-size:1.08rem;font-weight:800;display:flex;align-items:center;gap:.45rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph h3 .n{display:inline-grid;place-items:center;min-width:1.55rem;height:1.55rem;border-radius:.4rem;background:var(--ink);color:var(--y);font-size:.85rem}
.ph .sp{flex:1}
.chip-s{font-size:.85rem;font-weight:700;padding:.2rem .55rem;border-radius:1rem;background:#fff;border:1px solid var(--line2);white-space:nowrap}
.more{font-size:.85rem;font-weight:700;padding:.3rem .65rem;border-radius:.4rem;background:var(--ink);color:#fff;white-space:nowrap;flex:none}
.dash .more{padding:.2rem .55rem;font-size:1rem}
.calfoot{display:flex;justify-content:center;margin-top:.45rem}
.pb{flex:1;min-height:0;overflow:auto;padding:.6rem}

/* dashboard */
.dash{display:grid;gap:.6rem;height:100%;grid-template-columns:minmax(16rem,18%) minmax(0,1fr) minmax(22rem,25%);grid-template-rows:auto minmax(0,1fr)}
.dash .kpis{grid-column:1/-1}
.colL,.colR,.colC{display:flex;flex-direction:column;gap:.6rem;min-height:0}
.cals{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;flex:none}
.rtop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.6rem;height:34%;flex:none}
.mapdash{flex:1;min-height:0} .mapdash .pb{padding:0;overflow:hidden;position:relative}
.mapblur{position:absolute;inset:-1.5rem;background-size:cover;background-position:center;filter:blur(14px) brightness(.85) saturate(1.1);transform:scale(1.05)}
.mapdash .mapfit{position:relative;padding:.4rem}
.grow{flex:1;min-height:0}

.kpis{display:flex;gap:.6rem;align-items:stretch}
.kpi{background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:.55rem .9rem;min-width:9rem;display:flex;flex-direction:column;justify-content:center}
.kpi .v{font-size:2rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .v .g{color:var(--ok)} .kpi .v .r{color:var(--bad)}
.kpi .l{font-size:.85rem;color:var(--mut);font-weight:600;margin-top:.15rem}
.kpi.crit .v{color:var(--bad)}
.leaders{flex:1;min-width:0;background:var(--card);border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--shadow);padding:.45rem .7rem;display:flex;align-items:center;gap:.6rem;overflow:hidden}
.leaders .lt{font-weight:800;font-size:.9rem;writing-mode:horizontal-tb;color:var(--mut);white-space:nowrap}
.leaders .ll{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none}
.ldr{display:flex;align-items:center;gap:.45rem;background:var(--y3);border:1px solid var(--line);border-radius:2rem;padding:.2rem .7rem .2rem .2rem;white-space:nowrap}
.ldr b{font-size:.9rem;display:block;line-height:1.1}
.ldr small{font-size:.75rem;color:var(--mut);display:block;line-height:1.1}

.av{width:2.3rem;height:2.3rem;border-radius:50%;object-fit:cover;flex:none;background:var(--y);display:inline-grid;place-items:center;font-weight:800;font-size:.85rem;color:var(--ink);border:2px solid #fff}
.av.lg{width:3.6rem;height:3.6rem;font-size:1.2rem}
.av.sm{width:1.8rem;height:1.8rem;font-size:.7rem}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.22rem}
.cal .h{font-size:.72rem;text-align:center;color:var(--mut);font-weight:700}
.cal button{min-width:0;padding:0;aspect-ratio:1;border-radius:.35rem;background:#f1ede2;font-weight:700;font-size:.9rem;display:grid;place-items:center;border:2px solid transparent}
.cal button.g{background:#22a04b;color:#fff}
.cal button.r{background:var(--bad);color:#fff}
.cal button.today{border-color:var(--ink)}
.cal button.fut{opacity:.55}
.cal.big{gap:.5rem}
.cal.big button{font-size:1.6rem;border-radius:.6rem;aspect-ratio:1.4}
.cal.big .h{font-size:1rem}
.legend{display:flex;gap:1rem;font-size:.9rem;color:var(--mut);margin-top:.6rem;flex-wrap:wrap}
.legend i{display:inline-block;width:1rem;height:1rem;border-radius:.25rem;vertical-align:-.15rem;margin-right:.3rem}

/* engagement grid */
.eg{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed}
.eg th{position:sticky;top:0;background:#fbf8ef;z-index:2;font-size:.9rem;padding:.4rem .3rem;border-bottom:2px solid var(--line2);text-align:left}
.eg th.today{background:var(--y)}
.eg th small{display:block;font-weight:600;color:var(--mut);font-size:.75rem}
.eg th.today small{color:var(--ink)}
.eg td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top;padding:.25rem;height:3.2rem}
.eg td.today{background:#fffbea}
.eg td.tl{border-left:0;padding:.35rem .5rem;background:#fcfaf4}
.tl .code{display:inline-block;font-size:.72rem;font-weight:800;color:#fff;border-radius:.3rem;padding:.08rem .35rem;margin-bottom:.15rem}
.tl .nm{font-size:.86rem;font-weight:700;line-height:1.15}
.cell{display:flex;flex-wrap:wrap;gap:.2rem;align-items:flex-start;min-height:100%}
.pc{display:inline-flex;align-items:center;gap:.25rem;max-width:100%;padding:.18rem .45rem .18rem .3rem;border-radius:.4rem;font-size:.86rem;font-weight:700;line-height:1.15;border:1px solid transparent}
.pc .st{font-weight:900;font-size:.95rem;width:1rem;text-align:center;flex:none}
.pc .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc.ok{background:var(--okbg);color:#14532d;border-color:#bbf7d0}
.pc.ok .st{color:var(--ok)}
.pc.miss{background:var(--badbg);color:#7f1d1d;border-color:#fecaca}
.pc.miss .st{color:var(--bad)}
.pc.plan{background:var(--planbg);color:#334155;border-color:#dbe3ea;border-style:dashed}
.add{display:inline-grid;place-items:center;width:1.8rem;height:1.6rem;border-radius:.4rem;border:1.5px dashed var(--line2);color:var(--mut);font-weight:800;font-size:1.05rem}
.big-grid .eg td{height:5.4rem;padding:.4rem}
.big-grid .pc{font-size:1.1rem;padding:.35rem .6rem .35rem .4rem}
.big-grid .add{width:2.6rem;height:2.4rem;font-size:1.4rem}
.big-grid .eg th{font-size:1.1rem}
.big-grid .tl .nm{font-size:1.05rem}
.view .add{display:none}

/* Excel загварын хүснэгт */
.eg2{width:100%;border-collapse:collapse;table-layout:fixed}
.eg2 col.ckc{width:2.3rem}
.eg2 th{position:sticky;top:0;z-index:2;background:#fbf8ef;font-size:.95rem;padding:.4rem .3rem;border:1px solid var(--line2);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eg2 th small{font-weight:600;color:var(--mut);font-size:.72rem}
.eg2 th.today{background:var(--y)} .eg2 th.today small{color:var(--ink)}
.eg2 tr.band td{background:#f6f1e1;text-align:center;font-weight:800;font-size:.92rem;padding:.22rem .4rem;border:1px solid var(--line2);position:relative}
.eg2 tr.band .code{display:inline-block;font-size:.7rem;font-weight:800;color:#fff;border-radius:.3rem;padding:.05rem .35rem;margin-right:.45rem;vertical-align:.08rem}
.rowadd{position:relative;float:right;font-size:.75rem;font-weight:700;padding:.1rem .5rem;border-radius:.3rem;background:#fff;border:1px solid var(--line2);margin-left:.3rem}
.eg2 td.nm,.eg2 td.ck{border:1px solid var(--line2);padding:0;height:var(--rh,2.9rem);background:#fff}
.eg2 td.today{background:#fffbea}
.slotb{width:100%;height:100%;display:flex;align-items:center;gap:.3rem;padding:0 .4rem;text-align:left;font-weight:700;font-size:.92rem;min-height:var(--rh,2.9rem)}
.slotb .tx{overflow:hidden;white-space:nowrap;flex:1;min-width:0;letter-spacing:-.01em;font-size:1.1rem;text-align:center;line-height:1.35;padding:.1em 0}
.slotb .nt{color:var(--mut);font-size:.8rem}
.slotb.blank .plus{margin:auto;color:#cfc5a8;font-size:1.3rem;font-weight:800}
.view .slotb.blank .plus{display:none}
.eg2 td.ck{display:table-cell}
.ckb{display:block;width:100%;height:calc(var(--rh,2.9rem) / 2);min-height:1.2rem;font-weight:900;font-size:1.05rem;line-height:1;border-bottom:1px solid var(--line)}
.ckb:last-child{border-bottom:0}
.ckb.ok{background:var(--okbg);color:var(--ok)} .ckb.miss{background:var(--badbg);color:var(--bad)}
.big-grid .slotb .tx{font-size:1.4rem} .big-grid .ckb{font-size:1.35rem}
.big-grid .eg2 col.ckc{width:3rem} .big-grid .eg2 th{font-size:1.1rem} .big-grid .eg2 tr.band td{font-size:1.05rem}

.dash .slotb{padding:0 .25rem} .dash .ckb{font-size:.9rem} .dash .eg2 col.ckc{width:1.9rem}
.dash .ph{padding:.4rem .5rem;gap:.3rem} .dash .ph h3{font-size:.98rem;gap:.35rem} .dash .ph h3 .n{min-width:1.4rem;height:1.4rem;font-size:.78rem}
.dash .pb{padding:.5rem}
.scnt{font-size:.82rem;font-weight:800;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:1rem;padding:.1rem .5rem;white-space:nowrap;min-width:2.6rem;text-align:center}
.scnt.z{opacity:.45}
.star{transition:transform .15s} .star:active{transform:scale(1.3)}
#starpop{position:fixed;inset:0;z-index:90;display:none;place-items:center;background:radial-gradient(ellipse at 50% 40%,rgba(52,92,150,.82),rgba(14,30,60,.92));backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
#starpop.show{display:grid;animation:spFade .25s ease-out}
.sp-wrap{text-align:center;color:#fff;padding:2rem;animation:spPop .5s cubic-bezier(.2,1.4,.4,1)}
.sp-photo{width:15rem;height:15rem;margin:0 auto;border-radius:50%;padding:.55rem;background:linear-gradient(145deg,#f7e7a1,#c9a03c 45%,#f3d77a 70%,#a87f22);box-shadow:0 0 0 .25rem rgba(255,255,255,.15),0 1.2rem 3rem rgba(0,0,0,.45),0 0 3rem rgba(247,215,110,.35)}
.sp-photo img,.sp-photo span{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:#f4f1ea;color:#1d1d1b;font-size:4.5rem;font-weight:900;border:.3rem solid #fffdf3}
.sp-spin{margin:1.6rem auto .4rem;height:5.2rem;perspective:30rem}
.sp-spin span{display:inline-block;font-size:5.2rem;line-height:1;color:#fff;text-shadow:0 0 1.2rem rgba(255,255,255,.85),0 0 2.6rem rgba(255,214,90,.75);animation:spRot 1.1s linear infinite}
.sp-name{font-size:4.4rem;font-weight:900;font-style:italic;letter-spacing:.01em;line-height:1.05;text-shadow:0 .25rem .8rem rgba(0,0,0,.45)}
.sp-role{font-size:2.1rem;font-weight:800;font-style:italic;margin-top:.35rem;text-shadow:0 .2rem .6rem rgba(0,0,0,.4)}
.sp-cap{font-size:1.05rem;font-weight:600;margin-top:.9rem;opacity:.85}
.sp-cnt{display:inline-block;margin-top:1rem;font-size:1.2rem;font-weight:700;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:2rem;padding:.4rem 1.1rem}
.sp-cnt b{color:#fde68a;font-size:1.45rem;margin-left:.3rem}
.sp-undo{display:block;margin:1.1rem auto 0;font-size:.9rem;font-weight:700;padding:.45rem 1.1rem;border-radius:.5rem;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.08);color:#fff}
.sp-bar{position:fixed;left:0;bottom:0;height:.4rem;background:linear-gradient(90deg,#f7e7a1,#c9a03c);animation:spBar 2.5s linear forwards}
@keyframes spFade{from{opacity:0}}
@keyframes spPop{from{transform:scale(.85);opacity:0}}
@keyframes spRot{from{transform:rotateY(0)}to{transform:rotateY(360deg)}}
@keyframes spBar{from{width:100%}to{width:0}}
@media (prefers-reduced-motion:reduce){.sp-wrap,#starpop.show{animation:none}.sp-spin span{animation-duration:3s}}
/* v2 нэмэлт */
.lx{margin-left:.2rem;width:1.4rem;height:1.4rem;border-radius:50%;background:#fff;border:1px solid var(--line2);font-weight:800;line-height:1;color:var(--mut)}
.mtext{font-size:.85rem;line-height:1.35;background:#fffbea;border:1px solid var(--line);border-radius:.45rem;padding:.35rem .5rem;margin-bottom:.4rem;white-space:pre-wrap;max-height:6.5rem;overflow:auto}
.mtext.risk{background:#fef2f2;border-color:#fecaca;color:#7f1d1d;font-weight:600}
.avbtn{position:relative;padding:0;border-radius:50%;flex:none}
.avbtn i{position:absolute;right:-.2rem;bottom:-.2rem;font-style:normal;font-size:.9rem;background:#fff;border-radius:50%;width:1.5rem;height:1.5rem;display:grid;place-items:center;box-shadow:var(--shadow)}
.pb{position:relative}
.inkover{position:absolute;inset:0;pointer-events:none;z-index:3}
.inkover canvas{position:absolute;inset:0;width:100%;height:100%}
.inkover.on{pointer-events:auto;touch-action:none;outline:3px dashed rgba(220,38,38,.35);outline-offset:-3px;cursor:crosshair}
.pen.sm{width:1.7rem;height:1.7rem;border-width:2px;flex:none}
.more.on{background:var(--y);color:var(--ink)}
.pindots{display:flex;gap:.8rem;justify-content:center;margin:.4rem 0 1.2rem}
.pindots i{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid var(--ink)}
.pindots i.on{background:var(--ink)}
.pindots.bad{animation:shake .4s}.pindots.bad i{border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-.6rem)}75%{transform:translateX(.6rem)}}
.pinpad{display:grid;grid-template-columns:repeat(3,5.2rem);gap:.7rem;justify-content:center}
.pinpad button{height:4.4rem;border-radius:1rem;background:#f4f0e3;font-size:1.7rem;font-weight:800}
.pinpad button:active{background:var(--y)}
body.display .tabs, body.display #btnEdit, body.display .sub .sync, body.display .sub .sbtn:not(#todayB), body.display .datenav input{display:none!important}
body.display .sub{padding:.35rem 1rem}
body:not(.view) .ed{} body.view .ed{display:none}
.arch{border:1px solid var(--line);border-radius:.7rem;margin-bottom:.7rem;overflow:hidden}
.arch-h{display:flex;align-items:center;gap:.6rem;padding:.6rem .8rem;background:#fbf8ef;border-bottom:1px solid var(--line)}
.arch-h .sp{flex:1}
.arch-l{display:flex;flex-wrap:wrap;gap:.45rem;padding:.6rem .8rem}
.arch-p{display:inline-flex;align-items:center;gap:.4rem;background:#fff;border:1px solid var(--line);border-radius:2rem;padding:.2rem .3rem .2rem .2rem;font-size:.9rem}
/* ээлж */
.shift{display:flex;background:#34332e;border-radius:.6rem;padding:.2rem;gap:.2rem;flex:none;margin-left:.8rem}
.shift button{padding:.45rem .8rem;border-radius:.45rem;font-weight:800;font-size:.95rem;color:#d6d2c4;white-space:nowrap}
.shift button.on{background:var(--y);color:var(--ink)}
.shtag{display:inline-block;font-size:.85rem;font-weight:800;background:var(--ink);color:var(--y);border-radius:.4rem;padding:.15rem .5rem;margin-right:.5rem;vertical-align:.15rem}
body.display .shift{display:none}
/* шөнийн ээлж — цэнхэр */
body.night{--y:#5bb8e6;--y2:#a9dcf5;--y3:#e3f3fc;--bg:#e8f1f8;--line:#cfe2ef;--line2:#b3cfe3;--ink:#0b2340;--ink2:#1c3a5c;--mut:#5b7186}
body.night .top{background:#0b2340}
body.night .tabs button{color:#d5e6f3} body.night .tabs button .n{background:#1c3a5c}
body.night .tbtn,body.night .shift{background:#1c3a5c} body.night .tbtn.on{background:var(--y);color:var(--ink)} body.night .shift button{color:#cfe3f2}
body.night .brand small{color:#9fbcd4}
body.night .eg2 th,body.night .eg th{background:#f0f7fc} body.night .eg2 th.today,body.night .eg th.today{background:var(--y)}
body.night .eg2 tr.band td{background:#dcedf8}
body.night .eg2 td.today,body.night .eg td.today{background:#eaf6fd}
body.night .eg td.tl{background:#f4f9fd}
body.night .cal button{background:#e6f0f7} body.night .cal button.g{background:#22a04b} body.night .cal button.r{background:var(--bad)}
body.night .seg{background:#d5e6f2} body.night .pinpad button{background:#e3eef6}
body.night .empty{background:#f4f9fd}
body.night .mtext{background:#eef7fd}
body.night .arch-h{background:#f0f7fc}
body.night .inkwrap{background:repeating-linear-gradient(#fff 0 2.3rem,#dbe9f3 2.3rem calc(2.3rem + 1px))}
body.night .slotb.blank .plus{color:#a9c4d8}
.eg2 td.wkband{padding:0!important;border-top:0!important}
.eg2 td.wkband .wkgrid>div{padding:.22rem .4rem}
.eg2 td.wkband .wkgrid>div+div{border-left:1px solid var(--line2)}
.eg2 td.wkrow{padding:0;height:var(--rh,2.9rem);border:1px solid var(--line2);background:#fff}
.wkgrid{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;height:100%}
.wkc{display:flex;min-width:0;height:var(--rh,2.9rem)}
.wkc+.wkc{border-left:1px solid var(--line2)}
.wkc .slotb{flex:1;min-width:0}

function getDoc(key, def){
  if(!S.docs[key]) S.docs[key] = { data: def(), t: 0 };
  return S.docs[key].data;
}
function peek(key, def){ return S.docs[key] ? S.docs[key].data : def(); }
function commit(key, {noRender} = {}){
  S.docs[key].t = Date.now();
  saveLocal(key);
  S.dirty.add(key);
  queuePush();
  if(!noRender) render();
}
const settings = () => { const s = getDoc('settings', defSettings); if(!s.types) s.types = DEFAULT_TYPES.map(t=>({...t})); if(!s.leaders) s.leaders=[]; if(!s.extraPeople) s.extraPeople=[]; if(!s._v2){ s.types.forEach(t => { if(t.slots === undefined) t.slots = t.code === 'SI' ? 2 : 1; }); s._v2 = 1; } return s; };

// Ээлж бүрийн engagement төрлүүд (шөнө: SI 1 хүн, Green Hat байхгүй, Coach/Trainee 7 хоногт 1)
function typesFor(){
  const st = settings();
  if(S.shift !== 'night') return st.types;
  if(!Array.isArray(st.nightTypes)) st.nightTypes = st.types.filter(t => t.code !== 'GH').map(t => ({ ...t, slots:1, freq: (t.code === 'CP' || t.code === 'TP') ? 'week' : 'day' }));
  return st.nightTypes;
}
const dayLabel = day => day === 'w' ? '7 хоногт 1' : DOWL[weekDays(S.date)[day].getDay()];

/* ================= week / month keys ================= */
function weekStartDate(d){ const ws = settings().weekStart ?? 6; const diff = (d.getDay() - ws + 7) % 7; const x = addDays(d, -diff); x.setHours(0,0,0,0); return x; }
function weekKey(d){ const s = weekStartDate(d); const [y,w] = isoWeek(s); return `${y}-W${pad(w)}`; }
function weekDays(d){ const s = weekStartDate(d); return [...Array(7)].map((_,i)=>addDays(s,i)); }
const monthKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
// Ээлж: өдөр = үндсэн түлхүүр, шөнө = 'n:' угтвартай тусдаа мэдээлэл
const SK = k => (S.shift === 'night' ? 'n:' : '') + k;
const curWeek = () => getDoc(SK('week:'+weekKey(S.date)), defWeek);
const curMonth = () => getDoc(SK('month:'+monthKey(S.date)), defMonth);
const wkey = () => SK('week:'+weekKey(S.date));
// Чиглүүлэгч — долоо хоног бүр тусдаа; хоосон бол өмнөх долоо хоногийнхыг авна
function leadersFor(){
  const w = curWeek(); if(Array.isArray(w.leaders)) return w.leaders;
  const cur = wkey(); const prev = Object.keys(S.docs).filter(k => k.startsWith(SK('week:')) && k < cur && Array.isArray(S.docs[k].data?.leaders)).sort().pop();
  return prev ? S.docs[prev].data.leaders.slice() : settings().leaders.slice();
}
function setLeaders(list){ curWeek().leaders = list; commit(wkey()); }
const mkey = () => SK('month:'+monthKey(S.date));

/* ================= cloud sync ================= */
let pushTimer = null;
function setSync(state, text){
  S.sync = state;
  const el = $('#sync');
  const map = { ok:['ok','Хадгалсан (cloud)'], busy:['busy','Хадгалж байна…'], bad:['bad','Холболт алдаатай — дотор хадгалсан'], local:['','Зөвхөн энэ төхөөрөмжид'] };
  const [c,t] = map[state] || map.local;
  el.innerHTML = `<span class="dot ${c}"></span><span>${esc(text||t)}</span>`;
}
function queuePush(){
  if(!S.cloud){ setSync('local'); return; }
  setSync('busy');
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushDirty, 700);
}
async function pushDirty(){
  if(!S.cloud || !S.dirty.size) { if(S.cloud) setSync('ok'); return; }
  const keys = [...S.dirty]; S.dirty.clear();
  const rows = keys.map(k => ({ key:k, data:S.docs[k].data, client_t:S.docs[k].t, updated_by:S.user?.email || null, updated_at:new Date().toISOString() }));
  const { error } = await sb.from('lif_docs').upsert(rows);
  if(error){ keys.forEach(k=>S.dirty.add(k)); console.warn(error); setSync('bad', error.code==='42501' ? 'Засах эрхгүй (зөвхөн админ)' : 'Cloud-д хадгалж чадсангүй'); setTimeout(queuePush, 15000); return; }
  setSync('ok');
}
async function cloudLoad(){
  const { data, error } = await sb.from('lif_docs').select('key,data,client_t');
  if(error){ console.warn(error); S.cloud = false; setSync('bad', error.code==='42P01' ? 'lif_docs хүснэгт алга — SQL ажиллуулна уу' : 'Cloud уншиж чадсангүй'); return false; }
  const seen = new Set();
  for(const r of data){
    seen.add(r.key);
    const loc = S.docs[r.key];
    if(!loc || (r.client_t||0) >= (loc.t||0)){ S.docs[r.key] = { data:r.data, t:r.client_t||0 }; saveLocal(r.key); }
    else S.dirty.add(r.key); // local newer (offline edit) → push
  }
  for(const k of Object.keys(S.docs)) if(!seen.has(k) && S.docs[k].t) S.dirty.add(k);
  return true;
}
async function loadPeople(){
  try{
    const [d,e] = await Promise.all([
      sb.from('departments').select('id,name'),
      sb.from('employees').select('id,full_name,position,photo_url,department_id,active').eq('active', true).order('full_name').range(0,1999)
    ]);
    if(e.error) throw e.error;
    const dm = Object.fromEntries((d.data||[]).map(x=>[x.id,x.name]));
    S.people = (e.data||[]).map(x => ({ id:'e'+x.id, name:x.full_name, role:x.position||'', dept:dm[x.department_id]||'', photo:x.photo_url||'' }));
    localStorage.setItem('lif:people', JSON.stringify(S.people));
  }catch(err){ console.warn('people', err); }
}
let channel = null;
function subscribe(){
  if(channel) sb.removeChannel(channel);
  channel = sb.channel('lif_docs_rt').on('postgres_changes', { event:'*', schema:'public', table:'lif_docs' }, p => {
    const r = p.new; if(!r || !r.key) return;
    const loc = S.docs[r.key];
    if(S.dirty.has(r.key)) return;
    if(loc && (r.client_t||0) <= (loc.t||0)) return;
    S.docs[r.key] = { data:r.data, t:r.client_t||0 }; saveLocal(r.key);
    if(S.drawing || $('#modal').classList.contains('open')) S.needRender = true; else render();
  }).subscribe();
}
async function startCloud(){
  if(!sb) { setSync('local'); return; }
  const { data } = await sb.auth.getSession();
  S.user = data?.session?.user || null;
  renderLoginBtn();
  if(!S.user){ S.cloud = false; setSync('local','Нэвтрээгүй — зөвхөн энэ төхөөрөмжид'); return; }
  setSync('busy','Ачаалж байна…');
  const ok = await cloudLoad();
  await loadPeople();
  try{ const r = await sb.rpc('is_admin'); S.isAdmin = !!r.data; }catch(e){}
  if(ok){ S.cloud = true; subscribe(); if(S.dirty.size) queuePush(); else setSync('ok'); }
  render();
}
// fallback poll (realtime унтарсан тохиолдолд)
setInterval(async () => {
  if(!S.cloud || S.dirty.size || S.drawing) return;
  const keys = ['settings', wkey(), mkey(), SK('risks'), 'schedule', 'mapbg', 'featured', SK('stars'), dkey()];
  const { data } = await sb.from('lif_docs').select('key,data,client_t').in('key', keys);
  let ch = false;
  for(const r of data||[]){ const loc = S.docs[r.key]; if(!loc || (r.client_t||0) > (loc.t||0)){ S.docs[r.key] = {data:r.data, t:r.client_t||0}; saveLocal(r.key); ch = true; } }
  if(ch && !$('#modal').classList.contains('open')) render();
}, 60000);

/* ================= people helpers ================= */
const normName = n => String(n||'').toLowerCase().replace(/[.\-_,]/g,' ').replace(/\s+/g,' ').trim();
const tokKey = n => normName(n).split(' ').filter(Boolean).sort().join(' ');
function basePeople(){ return [...S.people, ...settings().extraPeople.map(p => ({...p, extra:true}))]; }
function matchPerson(n, list){
  list = list || basePeople(); const a = normName(n), k = tokKey(n); if(!a) return null;
  return list.find(p => normName(p.name) === a) || list.find(p => tokKey(p.name) === k)
      || list.find(p => { const t = normName(p.name).split(' '); const u = a.split(' ').filter(x => x.length > 2); return u.length && u.every(x => t.some(y => y === x || (x.length > 3 && y.startsWith(x)))); }) || null;
}
const featDoc = () => peek('featured', () => ({ list:[] }));
// Од (онцлох ярилцлага хийсэн) — бүх цаг үеийн бүртгэл
const starLog = () => peek(SK('stars'), () => ({ log:[] })).log || [];
// Од: нэг хүнд нэг өдөрт нэг; тоо нь тухайн 7 хоногийнх, өмнөх 7 хоногийнх архивт үлдэнэ
const starWeek = e => weekKey(parseYmd(e.date));
function starInfo(name, wk){ wk = wk || weekKey(S.date); const k = normName(name), today = ymd(S.date), days = new Set(); let td = false;
  for(const e of starLog()) if(normName(e.name) === k){ if(e.date === today) td = true; if(starWeek(e) === wk) days.add(e.date); }
  return { n:days.size, today:td }; }
function allPeople(){
  const base = basePeople();
  const fl = (featDoc().list||[]).filter(f => !matchPerson(f.name, base)).map(f => ({ id:'f'+f.name, name:f.name, role:f.role||'', dept:f.dept||'', photo:'', feat:true }));
  return [...base, ...fl];
}
function personByName(n){ const all = allPeople(); return all.find(p => p.name === n) || matchPerson(n, all); }
const photoOf = n => (peek('photos', () => ({})).map || {})[normName(n)] || '';
function avatar(p, cls=''){
  if(p && !p.photo && p.name){ const ph = photoOf(p.name); if(ph) p = {...p, photo:ph}; }
  if(p?.photo) return `<img class="av ${cls}" src="${esc(p.photo)}" alt="" loading="lazy">`;
  return `<span class="av ${cls}">${esc(initials(p?.name).toUpperCase())}</span>`;
}

/* ================= stats ================= */
function weekStats(w){
  let ok=0, miss=0, plan=0; const names = new Set(); const perName = {};
  const c1 = {g:0,r:0}, c2 = {g:0,r:0};
  for(const t of Object.values(w.grid||{})) for(const arr of Object.values(t)) for(const e of arr){
    if(!e || !e.name) continue;
    e.st = slotSt(e);
    if(e.a==='ok') c1.g++; else if(e.a==='miss') c1.r++;
    if(e.b==='ok') c2.g++; else if(e.b==='miss') c2.r++;
    if(e.st==='ok') ok++; else if(e.st==='miss') miss++; else plan++;
    if(e.st!=='plan'){ names.add(e.name); }
    perName[e.name] = perName[e.name] || {ok:0,miss:0,plan:0,codes:new Set()};
    perName[e.name][e.st]++;
  }
  for(const [code,t] of Object.entries(w.grid||{})) for(const arr of Object.values(t)) for(const e of arr) if(e && e.name) perName[e.name].codes.add(code);
  return { c1, c2, ok, miss, plan, people:names.size, perName, rate: ok+miss ? Math.round(ok*100/(ok+miss)) : null };
}
// хуучин {st} → шинэ {a,b}
function slotSt(e){ if(e.a===undefined && e.b===undefined){ e.a = e.st==='ok'?'ok':e.st==='miss'?'miss':''; e.b=''; } return (e.a==='miss'||e.b==='miss') ? 'miss' : (e.a==='ok'||e.b==='ok') ? 'ok' : 'plan'; }
function calCount(obj){ let g=0,r=0; for(const v of Object.values(obj||{})){ if(v==='g') g++; else if(v==='r') r++; } return {g,r}; }

function panel(num, title, body, {right='', more='', cls='', id='', head=''}={}){
  return `<section class="panel ${cls}" ${id?`id="${id}"`:''}><div class="ph"><h3 ${head?`data-tab="${head}" style="cursor:pointer"`:''}>${num?`<span class="n">${num}</span>`:''}${esc(title)}</h3><span class="sp"></span>${right}${more?`<button class="more" data-tab="${more}" aria-label="Дэлгэрэнгүй">${S.tab==='dash'?'›':'Дэлгэрэнгүй'}</button>`:''}</div><div class="pb">${body}</div></section>`;
}
function calHTML(kind, big){
  const m = curMonth()[kind] || {};
  const y = S.date.getFullYear(), mo = S.date.getMonth();
  const first = new Date(y, mo, 1), days = new Date(y, mo+1, 0).getDate();
  const startDow = (first.getDay() + 6) % 7; // Даваа эхэлнэ
  const today = ymd(new Date());
  let h = ['Да','Мя','Лх','Пү','Ба','Бя','Ня'].map(d=>`<div class="h">${d}</div>`).join('');
  for(let i=0;i<startDow;i++) h += '<div></div>';
  for(let d=1; d<=days; d++){
    const k = ymd(new Date(y,mo,d)); const v = m[d] || '';
    h += `<button data-cal="${kind}" data-day="${d}" class="${v} ${k===today?'today':''} ${k>today?'fut':''}" aria-label="${d}">${d}</button>`;
  }
  return `<div class="cal ${big?'big':''}">${h}</div>`;
}
function calBadge(kind){ const c = calCount(curMonth()[kind]); return `<span class="chip-s"><span style="color:var(--ok)">${c.g} G</span> / <span style="color:var(--bad)">${c.r} R</span></span>`; }

// Хүснэгтэд зөвхөн нэр (эхний үг) — давхацвал 2-р үгийн эхний үсэг нэмнэ
function firstName(n){ n = String(n||'').trim(); const m = n.match(/^[^\s.]{1,3}\.\s*(\S+)/); return m ? m[1] : (n.split(/\s+/)[0] || n); }
function shortNamer(w){
  const all = new Set(); for(const t of Object.values(w.grid||{})) for(const arr of Object.values(t)) for(const e of arr||[]) if(e && e.name) all.add(e.name);
  const cnt = {}; for(const n of all){ const f = firstName(n).toLowerCase(); cnt[f] = (cnt[f]||0) + 1; }
  return n => { const f = firstName(n); if(cnt[f.toLowerCase()] > 1){ const rest = n.replace(/^[^\s.]{1,3}\.\s*/, '').split(/\s+/).filter(x => x.toLowerCase() !== f.toLowerCase()); const ini = (rest[0]||n)[0]; return ini ? `${f} ${ini}.` : f; } return f; };
}
function rowsFor(w, t){
  const g = w.grid[t.code] || {}; let n = Math.max(1, +t.slots || 1, (w.rows||{})[t.code] || 0);
  for(const arr of Object.values(g)) n = Math.max(n, (arr||[]).length);
  return n;
}
function gridHTML(){
  const st = settings(), w = curWeek(), ds = weekDays(S.date), today = ymd(new Date()), sn = shortNamer(w);
  const DEN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  let h = `<table class="eg2"><colgroup>${ds.map(()=>'<col><col class="ckc">').join('')}</colgroup><thead><tr>`;
  h += ds.map(d => `<th colspan="2" class="${ymd(d)===today?'today':''}">${DOWL[d.getDay()]} <small>${S.tab==='dash'?'':DEN[d.getDay()]+' · '}${d.getMonth()+1}/${d.getDate()}</small></th>`).join('');
  h += '</tr></thead><tbody>';
  const TT = typesFor();
  const cellHTML = (t, day, r, e, td, span) => {
    const ref = `${esc(t.code)}|${day}|${r}`; if(e && e.name) slotSt(e);
    const pp = e && e.name ? personByName(e.name) : null;
    return `<td class="nm${td}" ${span?`colspan="${span}"`:''}><button class="slotb ${e&&e.name?'':'blank'}" data-slot="${ref}">${e && e.name ? `${pp?.photo?`<img class="av sm" src="${esc(pp.photo)}" alt="">`:''}<span class="tx" title="${esc(e.name)}">${esc(sn(e.name))}</span>${e.note?'<span class="nt" title="Тэмдэглэлтэй">✎</span>':''}` : (S.edit?'<span class="plus">+</span>':'')}</button></td>`
      + `<td class="ck${td}"><button class="ckb ${e?.a||''}" data-ck="${ref}|a" aria-label="1-р тэмдэглэгээ">${e?.a==='ok'?'✓':e?.a==='miss'?'✗':''}</button><button class="ckb ${e?.b||''}" data-ck="${ref}|b" aria-label="2-р тэмдэглэгээ">${e?.b==='ok'?'✓':e?.b==='miss'?'✗':''}</button></td>`;
  };
  for(let ti=0; ti<TT.length; ti++){
    const t = TT[ti];
    if(t.freq === 'week'){
      // дараалсан 7 хоногийн төрлүүдийг нэг мөрөнд зэрэгцүүлнэ (2 хүртэл)
      const grp = [t]; if(TT[ti+1]?.freq === 'week'){ grp.push(TT[ti+1]); ti++; }
      h += `<tr class="band"><td colspan="14" class="wkband"><div class="wkgrid">${grp.map(g => `<div style="border-top:2px solid ${esc(g.color)}">${esc(g.name)} <small class="wk1">7 хоногт 1</small></div>`).join('')}</div></td></tr>`;
      h += `<tr class="slot"><td colspan="14" class="wkrow"><div class="wkgrid">${grp.map(g => { const e = (((w.grid[g.code]||{}).w)||[])[0], ref = `${esc(g.code)}|w|0`; if(e && e.name) slotSt(e); const pp = e && e.name ? personByName(e.name) : null;
        return `<div class="wkc"><button class="slotb ${e&&e.name?'':'blank'}" data-slot="${ref}">${e && e.name ? `${pp?.photo?`<img class="av sm" src="${esc(pp.photo)}" alt="">`:''}<span class="tx" title="${esc(e.name)}">${esc(sn(e.name))}</span>${e.note?'<span class="nt">✎</span>':''}` : (S.edit?'<span class="plus">+</span>':'')}</button><div class="ckw"><button class="ckb ${e?.a||''}" data-ck="${ref}|a">${e?.a==='ok'?'✓':e?.a==='miss'?'✗':''}</button><button class="ckb ${e?.b||''}" data-ck="${ref}|b">${e?.b==='ok'?'✓':e?.b==='miss'?'✗':''}</button></div></div>`; }).join('')}</div></td></tr>`;
      continue;
    }
    const n = rowsFor(w, t);
    h += `<tr class="band"><td colspan="14" style="border-top:2px solid ${esc(t.color)}">${esc(t.name)}</td></tr>`;
    for(let r=0; r<n; r++){
      h += '<tr class="slot">';
      ds.forEach((d,i) => { h += cellHTML(t, i, r, ((w.grid[t.code]||{})[i]||[])[r], ymd(d)===today ? ' today' : ''); });
      h += '</tr>';
    }
  }
  return h + '</tbody></table>';
}

function risksHTML(compact){
  const rs = (peek(SK('risks'), ()=>({list:[]})).list || []);
  const order = {crit:0, high:1, med:2, low:3};
  const list = rs.filter(r => compact ? !r.closed : true).sort((a,b) => (a.closed-b.closed) || (order[a.level]-order[b.level]));
  const LV = {crit:'КРИТИК', high:'ӨНДӨР', med:'ДУНД', low:'БАГА'};
  if(!list.length) return compact ? `<div class="empty"><div><b>Нээлттэй эрсдэл алга</b>${S.edit?'“5 Эрсдэл” цэснээс нэмнэ':''}</div></div>` : '';
  return list.slice(0, compact ? 6 : 999).map(r => `<div class="risk ${r.closed?'closed':''}"><span class="lv ${r.level}">${LV[r.level]}</span><div class="i"><b>${esc(r.text)}</b><small>${esc([r.area, r.owner, r.date].filter(Boolean).join(' · '))}</small></div>${!compact && S.edit ? `<button class="btn" data-rclose="${r.id}">${r.closed?'Сэргээх':'Хаах'}</button><button class="btn danger" data-rdel="${r.id}">Устгах</button>`:''}</div>`).join('');
}

// Газрын зургийн харьцаа (өргөн/өндөр) — pin нь зургийн өөрт нь харьцангуй
function mapAR(){
  const d = peek('mapbg', ()=>({})); if(!d.img) return 1.6;
  if(d.ar) return d.ar;
  if(S._arFor !== d.img){ S._arFor = d.img; const im = new Image(); im.onload = () => { const g = getDoc('mapbg', ()=>({})); g.ar = +(im.naturalWidth / im.naturalHeight).toFixed(4); commit('mapbg'); }; im.src = d.img; }
  return 1.6;
}
// Хуучин 16:10 хайрцагт харьцангуй байсан pin/зураасыг зургийн координат руу шилжүүлэх
function migrateMap(w, a){
  if(!w.map || w.map.v === 2 || !peek('mapbg', ()=>({})).ar) return;
  const B = 1.6, cv = a >= B ? (([x,y]) => [x, (y - (1 - B/a)/2) / (B/a)]) : (([x,y]) => [(x - (1 - a/B)/2) / (a/B), y]);
  const k = a >= B ? 1 : a/B;
  (w.map.markers||[]).forEach(m => { const [x,y] = cv([m.x, m.y]); m.x = +x.toFixed(4); m.y = +y.toFixed(4); });
  (w.map.ink||[]).forEach(st => { st.p = st.p.map(q => cv(q).map(v => +v.toFixed(4))); st.w = +(st.w / k).toFixed(5); });
  w.map.v = 2; commit(wkey(), {noRender:true});
}
function mapHTML(mini){
  const bg = peek('mapbg', ()=>({})).img, w = curWeek(), types = typesFor(), ar = mapAR();
  if(bg) migrateMap(w, ar); else if(w.map && !w.map.v) w.map.v = 2;
  const col = c => (types.find(t=>t.code===c)||{}).color || '#111';
  return `<div class="mapbox ${mini?'mapmini':''}" id="${mini?'mapMini':'mapMain'}" style="--ar:${ar}">${bg?`<img src="${bg}" alt="">`:`<div class="empty" style="position:absolute;inset:0;border:0"><div><b>Талбайн зураг оруулаагүй</b>${mini?'':'Доорх “Талбайн зураг солих” товчоор оруулна'}</div></div>`}<canvas></canvas>${(w.map.markers||[]).map(m => pinHTML(m, col(m.c))).join('')}</div>`;
}
// 📍 Ярилцлага хийсэн байршлын pin — анивчдаг
function pinHTML(m, col){
  const today = ymd(new Date()), now = m.date === today;
  const pp = m.name ? (personByName(m.name) || { name:m.name }) : null;
  const ph = pp ? (pp.photo || photoOf(pp.name)) : '';

  return `<div class="pin ${now?'now':''}" data-mk="${m.id}" style="left:${m.x*100}%;top:${m.y*100}%;--c:${col}">
    <span class="pr"></span><span class="pr p2"></span><span class="pr p3"></span>

    ${m.name ? `<span class="pl">${esc(firstName(m.name))}<i>${esc(m.c)}</i></span>` : ''}</div>`;
}

function fitGrid(){
  fitRO.disconnect();
  document.querySelectorAll('.eg2').forEach(tb => {
    const pb = tb.closest('.pb'); if(!pb) return; fitRO.observe(pb);
    tb.style.setProperty('--rh', '2.4rem');
    const cs = getComputedStyle(pb), avail = pb.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const head = tb.tHead.offsetHeight; let bands = 0; tb.querySelectorAll('tr.band').forEach(r => bands += r.offsetHeight);
    const n = tb.querySelectorAll('tr.slot').length; if(!n) return;
    const rem = parseFloat(getComputedStyle(document.documentElement).fontSize);
    const rh = Math.max(2.4*rem, Math.floor((avail - head - bands - n - 4) / n));
    tb.style.setProperty('--rh', rh + 'px');
    // бүх нэрийг жигд хэмжээтэй: хамгийн урт нэр багтах хэмжээг бүгдэд нь
    const xs = [...tb.querySelectorAll('.slotb .tx')];
    let fs = Math.round(Math.min(rh * .3, rem * 1.6)); const min = Math.max(9, rem * .62);
    xs.forEach(x => x.style.fontSize = fs + 'px');
    while(fs > min && xs.some(x => x.scrollWidth > x.clientWidth + 1)){ fs -= 0.5; xs.forEach(x => x.style.fontSize = fs + 'px'); }
  });
}
let fitT = null; let fitRO; const refit = () => { clearTimeout(fitT); fitT = setTimeout(fitGrid, 60); };

fitRO = new ResizeObserver(refit);

/* ================= Ink ================= */
class Ink{
  constructor(el, getStrokes, editable, kind){
    this.el = el; this.get = getStrokes; this.editable = editable; this.kind = kind;
    this.cv = el.querySelector('canvas') || el.appendChild(document.createElement('canvas'));
    this.ctx = this.cv.getContext('2d'); this.cur = null;
    this.ro = new ResizeObserver(() => this.resize()); this.ro.observe(el);
    if(editable){
      this.down = e => this.onDown(e); this.move = e => this.onMove(e); this.up = e => this.onUp(e);
      el.addEventListener('pointerdown', this.down); el.addEventListener('pointermove', this.move);
      el.addEventListener('pointerup', this.up); el.addEventListener('pointercancel', this.up); el.addEventListener('pointerleave', this.up);
    }
  }
  destroy(){ this.ro.disconnect(); if(this.editable){ ['pointerdown','pointermove','pointerup','pointercancel','pointerleave'].forEach((t,i)=>this.el.removeEventListener(t,[this.down,this.move,this.up,this.up,this.up][i])); } }
  resize(){ const r = this.el.getBoundingClientRect(), dpr = window.devicePixelRatio||1; this.w = r.width; this.h = r.height; this.cv.width = Math.max(1,r.width*dpr); this.cv.height = Math.max(1,r.height*dpr); this.ctx.setTransform(dpr,0,0,dpr,0,0); this.draw(); }
  pt(e){ const r = this.el.getBoundingClientRect(); return [ +( (e.clientX-r.left)/r.width ).toFixed(4), +( (e.clientY-r.top)/r.height ).toFixed(4) ]; }
  stroke(s){
    const c = this.ctx, p = s.p; if(!p.length) return;
    c.strokeStyle = s.c; c.fillStyle = s.c; c.lineWidth = Math.max(1, s.w * this.w); c.lineCap = 'round'; c.lineJoin = 'round';
    c.beginPath(); c.moveTo(p[0][0]*this.w, p[0][1]*this.h);
    if(p.length === 1){ c.arc(p[0][0]*this.w, p[0][1]*this.h, c.lineWidth/2, 0, 7); c.fill(); return; }
    for(let i=1;i<p.length-1;i++){ const mx = (p[i][0]+p[i+1][0])/2*this.w, my = (p[i][1]+p[i+1][1])/2*this.h; c.quadraticCurveTo(p[i][0]*this.w, p[i][1]*this.h, mx, my); }
    const l = p[p.length-1]; c.lineTo(l[0]*this.w, l[1]*this.h); c.stroke();
  }
  draw(){ this.ctx.clearRect(0,0,this.w,this.h); (this.get()||[]).forEach(s => this.stroke(s)); if(this.cur) this.stroke(this.cur); }
  onDown(e){
    if(!S.edit) return;
    if(e.target.closest('.mk,.pin')) return;
    const p = this.pt(e);
    if(this.kind === 'map'){ placePin(p[0], p[1]); return; }
    if(S.pen.mode === 'erase'){ this.eraseAt(p); return; }
    this.el.setPointerCapture?.(e.pointerId);
    const width = (e.pointerType === 'pen' ? 3 : 4) / Math.max(400, this.w) * (this.kind==='map' ? 1 : 1.2);
    this.cur = { c:S.pen.color, w:+width.toFixed(5), p:[p] }; S.drawing = true; this.draw();
  }
  onMove(e){
    if(!this.cur) { if(S.pen.mode==='erase' && e.buttons) this.eraseAt(this.pt(e)); return; }
    const p = this.pt(e), l = this.cur.p[this.cur.p.length-1];
    if(Math.abs(p[0]-l[0]) + Math.abs(p[1]-l[1]) < 0.002) return;
    this.cur.p.push(p); this.draw();
  }
  onUp(){
    if(!this.cur) return;
    const arr = this.get(); arr.push(this.cur); this.cur = null; S.drawing = false;
    commit(wkey(), {noRender:true}); this.draw();
    if(S.needRender) render();
  }
  eraseAt(p){
    const arr = this.get(), tol = 0.02;
    const i = arr.findIndex(s => s.p.some(q => Math.abs(q[0]-p[0]) < tol && Math.abs(q[1]-p[1]) < tol*(this.w/this.h)));
    if(i >= 0){ arr.splice(i,1); commit(wkey(), {noRender:true}); this.draw(); }
  }
}

      const lp = ldr.map(n => personByName(n) || {name:n});
      if(lp.length) body += `<div class="grp">Чиглүүлэгч</div><div class="pick">${lp.map(btn).join('')}</div>`;
      const rp = recent.filter(n => !ldr.includes(n)).slice(0,12).map(n => personByName(n) || {name:n});
      if(rp.length) body += `<div class="grp">Сүүлд сонгосон</div><div class="pick">${rp.map(btn).join('')}</div>`;
    }
    const byDept = {};
    filt.forEach(p => (byDept[p.dept||'Бусад'] = byDept[p.dept||'Бусад'] || []).push(p));
    for(const d of Object.keys(byDept).sort()) body += `<div class="grp">${esc(d)} (${byDept[d].length})</div><div class="pick">${byDept[d].map(btn).join('')}</div>`;
    if(ql) body = `<div class="pick"><button data-pp="${esc(q.trim())}" style="border-style:dashed"><span class="av">+</span><span><b>“${esc(q.trim())}”</b><small>Жагсаалтад байхгүй нэрээр нэмэх</small></span></button></div>` + body;
    if(!ps.length && !ql) body += `<p class="note">Ажилтны жагсаалт хоосон байна. Нэрийг дээрх талбарт бичээд нэмж болно, эсвэл нэвтэрч сургалтын системээс татна.</p>`;
    $('#pkBody').innerHTML = body;
  };
  openModal(`<div class="mh"><h2>${esc(title)}</h2><button class="x" data-close="1">×</button></div>

      <input class="inp" id="pkQ" placeholder="Нэр, албан тушаал, алба хайх…" style="flex:1;min-width:14rem;font-size:1.15rem;height:3.2rem" autocomplete="off">
      ${withStatus?`<div class="seg" id="pkSt"><button data-st="ok" class="on">✓ Хийсэн</button><button data-st="plan">○ Төлөвлөсөн</button><button data-st="miss">✗ Хийгээгүй</button></div>`:''}
    </div></div>
    <div class="mb" id="pkBody" style="flex:1"></div>`);
  draw();
  $('#pkQ').addEventListener('input', e => { q = e.target.value; draw(); });
  $('#pkQ').addEventListener('keydown', e => { if(e.key==='Enter' && q.trim()){ choose(q.trim()); } });
  if(withStatus) $('#pkSt').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if(!b) return; status = b.dataset.st; [...$('#pkSt').children].forEach(x=>x.classList.toggle('on', x===b)); });
  const choose = name => {
    const r = [name, ...recent.filter(n=>n!==name)].slice(0,30); localStorage.setItem('lif:recent', JSON.stringify(r));
    onPick(name, status);
    if(multi){ toast('Нэмлээ: '+name); q=''; $('#pkQ').value=''; draw(); } else closeModal();
  };

let xlsxP = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  return xlsxP = xlsxP || new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = () => ok(window.XLSX); sc.onerror = () => { xlsxP = null; no(new Error('Excel уншигч ачаалсангүй (интернэт шалгана уу)')); }; document.head.appendChild(sc); });
}
const COLS = {
  name:  ['овог нэр','овог, нэр','бүтэн нэр','ажилтны нэр','full name','fullname','name','нэр'],
  first: ['нэр','first name','firstname','given'],
  last:  ['овог','last name','lastname','surname','family'],
  role:  ['албан тушаал','position','title','role','job','тушаал'],
  dept:  ['алба','хэлтэс','department','dept','team','баг','нэгж']
};
function findHeader(rows){
  const score = r => r.reduce((n,c) => { const v = normName(c); return n + (Object.values(COLS).some(ks => ks.some(k => v === k || v.includes(k))) ? 1 : 0); }, 0);
  let best = 0, bi = -1;
  rows.slice(0, 15).forEach((r,i) => { const sc = score(r||[]); if(sc > best){ best = sc; bi = i; } });
  return bi;
}
function mapCols(h){
  const v = h.map(c => normName(c)), pick = (keys, avoid=[]) => { for(const k of keys){ const i = v.findIndex((x,j) => !avoid.includes(j) && x === k); if(i >= 0) return i; } for(const k of keys){ const i = v.findIndex((x,j) => !avoid.includes(j) && x.includes(k)); if(i >= 0) return i; } return -1; };
  const m = {};
  m.role = pick(COLS.role); m.dept = pick(COLS.dept, [m.role]);
  const used = [m.role, m.dept];
  m.name = pick(COLS.name.slice(0,7), used);   // "овог нэр", "full name" г.м.
  if(m.name < 0){ m.last = pick(COLS.last, used); m.first = pick(COLS.first, [...used, m.last]); if(m.last >= 0 && m.first < 0) m.name = m.last, m.last = -1; if(m.first >= 0 && m.last < 0) m.name = m.first, m.first = -1; }
  return m;
}
function parseSheet(XLSX, wb){
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:false });
    const hi = findHeader(rows); if(hi < 0) continue;
    const m = mapCols(rows[hi]); if(m.name < 0 && m.first < 0) continue;
    const seen = new Set(), list = [];
    for(const r of rows.slice(hi+1)){
      const cell = i => i >= 0 ? String(r[i] ?? '').trim() : '';
      const ln = cell(m.last).replace(/\.$/,''), fn = cell(m.first);
      let name = m.name >= 0 ? cell(m.name) : (ln && ln.length <= 2 && fn ? `${ln}.${fn}` : [fn, ln].filter(Boolean).join(' '));
      name = name.replace(/\s+/g,' ').trim();
      if(!name || /^\d+$/.test(name) || /^(нийт|total)/i.test(name)) continue;
      const k = normName(name); if(seen.has(k)) continue; seen.add(k);
      list.push({ name, role:cell(m.role), dept:cell(m.dept) });
    }
    if(list.length) return { sheet:sn, list, cols:m, header:rows[hi] };
  }
  return null;
}

/* ================= 4 Мэдээлэл ⇄ Excel (husnegt.xlsx загвар) ================= */
const EN_DAYS = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
const MN_DAYS = ['ням','даваа','мягмар','лхагва','пүрэв','баасан','бямба'];
const keyN = t => String(t||'').toLowerCase().replace(/[^a-zа-яөүё0-9]/g,'');
function dayOfHeader(v){ const k = keyN(v); if(!k) return -1; for(let i=0;i<7;i++){ if(k.startsWith(EN_DAYS[i].slice(0,3)) && k.length <= 12 || k.startsWith(MN_DAYS[i])) return i; } return -1; }
function typeOfBand(v, types){
  const k = keyN(v); if(k.length < 2) return null;
  return types.find(t => { const a = keyN(t.name), c = keyN(t.code); return k === a || k === c || (k.length >= 6 && (a.startsWith(k.slice(0,8)) || k.startsWith(a.slice(0,8)))); }) || null;
}
const markOf = v => { const t = String(v ?? '').trim().toLowerCase(); if(!t) return ''; if(/^(✓|✔|☑|v|√|1|ok|yes|y|тийм|done|g|green)$/.test(t)) return 'ok'; if(/^(✗|✘|x|×|0|no|n|үгүй|r|red)$/.test(t)) return 'miss'; return ''; };
function parseWeekSheet(XLSX, wb){
  const types = typesFor(), ds = weekDays(S.date);
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:false });
    // гарчгийн мөр: 3+ өдрийн нэр
    let hr = -1, cols = {};
    for(let r=0; r<Math.min(rows.length, 15) && hr<0; r++){ const m = {}; (rows[r]||[]).forEach((v,c) => { const d = dayOfHeader(v); if(d >= 0 && m[d] === undefined) m[d] = c; }); if(Object.keys(m).length >= 3){ hr = r; cols = m; } }
    if(hr < 0) continue;
    // өдөр (getDay) → энэ долоо хоногийн индекс
    const idxOf = {}; ds.forEach((d,i) => idxOf[d.getDay()] = i);
    // бүлгийн мөрүүд
    const bands = [];
    for(let r=hr+1; r<rows.length; r++){ const cells = (rows[r]||[]).filter(v => String(v).trim()); if(cells.length === 1){ const t = typeOfBand(cells[0], types); if(t) bands.push({ r, t }); } }
    if(!bands.length) continue;
    const grid = {}; let n = 0, marks = 0;
    bands.forEach((b, bi) => {
      const end = bi+1 < bands.length ? bands[bi+1].r : rows.length;
      let slot = 0;
      for(let r=b.r+1; r<end; r+=2, slot++){
        const top = rows[r]||[], bot = rows[r+1]||[];
        for(const [dw, c] of Object.entries(cols)){
          let di = idxOf[dw]; if(di === undefined) continue; if(b.t.freq === 'week') di = 'w';
          const name = String(top[c] ?? '').trim() || String(bot[c] ?? '').trim();
          if(!name) continue;
          const a = markOf(top[c+1]), bb = markOf(bot[c+1]); if(a) marks++; if(bb) marks++;
          const arr = ((grid[b.t.code] = grid[b.t.code] || {})[di] = (grid[b.t.code] || {})[di] || []);
          const sl = di === 'w' ? 0 : slot; if(di === 'w' && arr[0]) continue;
          while(arr.length < sl) arr.push(null);
          arr[sl] = { id:uid(), name, a, b:bb, note:'' }; n++;
        }
      }
    });
    if(n) return { sheet:sn, grid, n, marks, types:bands.map(b => b.t.name) };
  }
  return null;
}

    const sym = v => v === 'ok' ? '✓' : v === 'miss' ? '✗' : '';
    const aoa = [], merges = [];
    const head = []; ds.forEach((d,i) => { head.push(`${DEN[d.getDay()]} ${d.getMonth()+1}/${d.getDate()}`, ''); merges.push({ s:{r:0,c:i*2}, e:{r:0,c:i*2+1} }); }); aoa.push(head);
    for(const t of types){
      const r0 = aoa.length; aoa.push([t.name, ...Array(13).fill('')]); merges.push({ s:{r:r0,c:0}, e:{r:r0,c:13} });
      const n = t.freq === 'week' ? 1 : rowsFor(w, t);
      for(let k=0; k<n; k++){
        const top = [], bot = [];
        ds.forEach((d,i) => { const e = t.freq === 'week' ? (i === 0 && k === 0 ? (((w.grid[t.code]||{}).w)||[])[0] : null) : ((w.grid[t.code]||{})[i]||[])[k]; top.push(e?.name||'', sym(e?.a)); bot.push('', sym(e?.b)); merges.push({ s:{r:aoa.length,c:i*2}, e:{r:aoa.length+1,c:i*2} }); });
        aoa.push(top, bot);
      }
    }
    const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!merges'] = merges; ws['!cols'] = ds.flatMap(() => [{wch:20},{wch:4}]);
    const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, weekKey(S.date));
    // Онцлох ярилцлагын од
    const log = starLog().slice().sort((a,b) => (a.date < b.date ? -1 : 1));
    const tot = {}; log.forEach(e => tot[e.name] = (tot[e.name]||new Set()).add(e.date));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Нэр','Нийт од'], ...Object.entries(tot).map(([n,s]) => [n, s.size]).sort((a,b) => b[1]-a[1]), [], ['Огноо','Нэр'], ...log.map(e => [e.date, e.name])]), 'Онцлох од');
    // 1/2 сарын G/R
    const m = curMonth(), days = new Date(S.date.getFullYear(), S.date.getMonth()+1, 0).getDate(), lab = v => v==='g'?'GREEN':v==='r'?'RED':'';
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Өдөр','1 Чухалчлах','2 Чанар'], ...[...Array(days)].map((_,i) => [`${monthKey(S.date)}-${pad(i+1)}`, lab((m.prio||{})[i+1]), lab((m.qual||{})[i+1])])]), monthKey(S.date));
    XLSX.writeFile(wb, `LIF-${weekKey(S.date)}.xlsx`);
  }catch(err){ toast(err.message, true); }
}

idbAll().then(all => { let ch = false; for(const [k,v] of Object.entries(all)){ const cur = S.docs[k]; if(v && (!cur || (v.t||0) > (cur.t||0) || (!cur.t && v.t === 0 && JSON.stringify(cur).length < JSON.stringify(v).length))){ S.docs[k] = v; ch = true; } } for(const k of Object.keys(S.docs)) if(!all[k]) idbPut(k, S.docs[k]); if(ch) render(); });
setSync('local');
renderLoginBtn();
if(sb) sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT'){ S.user = null; renderLoginBtn(); } });
startCloud();
</script>
